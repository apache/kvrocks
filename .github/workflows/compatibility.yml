name: Compatibility Tests

on:
  push:
    branches:
      - unstable
      - '*.*'
      - '*.*.*'
  pull_request:
  merge_group:
    types:
      - checks_requested
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'merge_group' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'push' && github.event_name != 'release' }}

jobs:
  plan:
    name: Plan compatibility matrix
    runs-on: ubuntu-24.04
    outputs:
      has_compat_matrix: ${{ steps.plan.outputs.has_compat_matrix }}
      compat_matrix: ${{ steps.plan.outputs.compat_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate compatibility plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/ci_plan.py --changed-files-from-git

  build:
    name: Build current kvrocks image
    needs: plan
    if: ${{ needs.plan.outputs.has_compat_matrix == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # The old-version images are pulled from Docker Hub by the test; only
      # the "new" side is built here, once, and handed to the parallel test
      # jobs. Uses the same buildx method as the nightly image build; push
      # defaults to false, so the image stays local.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build current kvrocks image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: apache/kvrocks:current

      - name: Save image
        run: docker save apache/kvrocks:current | gzip > /tmp/kvrocks-current.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: kvrocks-current-image
          path: /tmp/kvrocks-current.tar.gz
          retention-days: 1

  compatibility-test:
    name: "${{ matrix.version }} -> current"
    runs-on: ubuntu-22.04
    needs: [plan, build]
    if: ${{ needs.plan.outputs.has_compat_matrix == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.plan.outputs.compat_matrix) }}
    env:
      KVROCKS_OLD_VERSION: ${{ matrix.version }}
      # Test old-version data against the PR's own build, not the released
      # :latest image, so an encoding regression in the change under test
      # is caught.
      KVROCKS_NEW_VERSION: current
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: kvrocks-current-image
          path: /tmp

      - name: Load image
        run: gunzip -c /tmp/kvrocks-current.tar.gz | docker load

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'tests/gocase/go.mod'
          cache: true
          cache-dependency-path: 'tests/gocase/go.sum'

      # Pull the old-version image up front so the test does not race a lazy
      # pull inside the container lifecycle.
      - name: Pull old kvrocks image
        run: docker pull docker.io/apache/kvrocks:${KVROCKS_OLD_VERSION#v}

      # KVROCKS_OLD_VERSION is read at runtime and is NOT part of the go test
      # cache key, so pass -count=1 when GOCACHE is enabled via actions/setup-go.
      - name: Run compatibility test
        run: |
          cd tests/gocase
          go test -count=1 -tags compat -run TestCompatibilityAllTypes ./integration/compatibility/

  required-compatibility:
    name: Required Compatibility
    runs-on: ubuntu-24.04
    if: always()
    needs: [plan, build, compatibility-test]
    steps:
      - name: Check compatibility job results
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          HAS_COMPAT_MATRIX: ${{ needs.plan.outputs.has_compat_matrix }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.compatibility-test.result }}
        run: |
          if [[ "$PLAN_RESULT" != "success" ]]; then
            echo "Compatibility planning failed (result=$PLAN_RESULT)."
            exit 1
          fi
          if [[ "$HAS_COMPAT_MATRIX" != "true" ]]; then
            echo "No compatibility tests planned."
            exit 0
          fi
          if [[ "$BUILD_RESULT" != "success" || "$TEST_RESULT" != "success" ]]; then
            echo "Compatibility checks failed (build=$BUILD_RESULT, tests=$TEST_RESULT)."
            exit 1
          fi
          echo "All planned compatibility checks succeeded."
