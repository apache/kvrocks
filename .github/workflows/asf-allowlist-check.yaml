name: ASF Allowlist Check

on:
  workflow_dispatch:
  # Detect allowlist removals and expiry warnings even without workflow changes.
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    paths:
      - ".github/**"
  push:
    branches:
      - unstable
    paths:
      - ".github/**"

permissions:
  contents: read

jobs:
  asf-allowlist-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: apache/infrastructure-actions/allowlist-check@61dcea11f19e2bbe1263f14d72235e8da17d3ad0 # allowlist-check/v1.0.0
        with:
          # Cover both .yml and .yaml files.
          scan-glob: ".github/**/*.y*ml"
