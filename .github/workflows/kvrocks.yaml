name: CI

on:
  push:
    branches:
      - unstable
      - '*.*'
      - '*.*.*'
      - 'action/**'
  pull_request:
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'merge_group' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  KVROCKS_DEPS_CACHE_DIR: build-deps

jobs:
  plan:
    name: Plan CI
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.plan.outputs.docs_only }}
      tier: ${{ steps.plan.outputs.tier }}
      tidy_mode: ${{ steps.plan.outputs.tidy_mode }}
      run_lint: ${{ steps.plan.outputs.run_lint }}
      has_build_matrix: ${{ steps.plan.outputs.has_build_matrix }}
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      has_container_matrix: ${{ steps.plan.outputs.has_container_matrix }}
      container_matrix: ${{ steps.plan.outputs.container_matrix }}
      run_docker: ${{ steps.plan.outputs.run_docker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run CI script unit tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Generate CI execution plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/ci_plan.py --changed-files-from-git

  check-typos:
    name: Check typos and licenses
    runs-on: ubuntu-24.04
    env:
      FORCE_COLOR: 1
    steps:
      - uses: actions/checkout@v7
      - name: Check typos
        uses: crate-ci/typos@v1.52.2
        with:
          config: .github/config/typos.toml
      - uses: apache/skywalking-eyes/header@v0.9.0
        with:
          config: .github/config/licenserc.yml

  check-and-lint:
    name: Lint and check code
    needs: [plan]
    if: ${{ needs.plan.outputs.run_lint == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Restore Kvrocks dependency cache
        id: cache-kvrocks-deps
        uses: actions/cache@v6
        with:
          path: ${{ env.KVROCKS_DEPS_CACHE_DIR }}
          key: kvrocks-full-deps-${{ hashFiles('x.py', 'CMakeLists.txt', 'cmake/**/*.cmake') }}
          enableCrossOsArchive: true
      - name: Fetch Kvrocks dependencies
        if: ${{ steps.cache-kvrocks-deps.outputs.cache-hit != 'true' }}
        run: |
          ./x.py fetch-deps ${{ env.KVROCKS_DEPS_CACHE_DIR }}
          ./x.py fetch-deps ${{ env.KVROCKS_DEPS_CACHE_DIR }} -D ENABLE_LUAJIT=OFF
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'tests/gocase/go.mod'
          cache: true
          cache-dependency-path: 'tests/gocase/go.sum'
      - name: Prepare Dependencies
        run: |
          wget --max-redirect=0 -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          echo "deb https://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-18 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt update
          sudo apt install -y clang-format-18 clang-tidy-18
      - name: Check with clang-format
        id: check-format
        run: ./x.py check format --clang-format-path clang-format-18
      - name: Check with clang-tidy
        shell: python
        env:
          TIDY_MODE: ${{ needs.plan.outputs.tidy_mode }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          fallback_full = os.environ["TIDY_MODE"] != "incremental" or os.environ["GITHUB_EVENT_NAME"] != "pull_request"
          targets = []
          if not fallback_full:
              base_sha, head_sha = os.environ["BASE_SHA"], os.environ["HEAD_SHA"]
              diff = None
              if base_sha and head_sha:
                  diff = subprocess.run(
                      ["git", "diff", "--no-renames", "--name-only", "-z", f"{base_sha}...{head_sha}"],
                      stdout=subprocess.PIPE,
                  )
              if diff is None or diff.returncode != 0:
                  print("Git diff unavailable; running full clang-tidy.", flush=True)
                  fallback_full = True
              else:
                  for name in diff.stdout.split(b"\x00"):
                      path = Path(os.fsdecode(name))
                      if path.suffix in {".h", ".hh", ".hpp", ".hxx"}:
                          fallback_full = True
                          break
                      if path.suffix in {".c", ".cc", ".cpp", ".cxx"} and path.is_file():
                          targets.append(rf"^{re.escape(str(path.absolute()))}\Z")

          if not fallback_full and not targets:
              print("No changed C/C++ translation units to check; skipping clang-tidy.")
              sys.exit(0)

          subprocess.run(["./x.py", "build", "--skip-build", "--dep-dir", os.environ["KVROCKS_DEPS_CACHE_DIR"]], check=True)
          jobs = subprocess.check_output(["nproc"], text=True).strip()
          if fallback_full:
              command = ["./x.py", "check", "tidy", "-j", jobs,
                         "--clang-tidy-path", "clang-tidy-18", "--run-clang-tidy-path", "run-clang-tidy-18"]
          else:
              print(f"Running incremental clang-tidy on {len(targets)} translation unit(s).", flush=True)
              command = ["run-clang-tidy-18", "-p", "build", "-j", jobs, "-clang-tidy-binary", "clang-tidy-18",
                         "-header-filter=kvrocks/src/|utils/kvrocks2redis/|tests/cppunit/", *targets]
          sys.exit(subprocess.call(command))
      - name: Lint with golangci-lint
        run: ./x.py check golangci-lint
      - name: Prepare format patch
        if: always() && steps.check-format.outcome != 'success'
        run: |
          ./x.py format --clang-format-path clang-format-18
          git diff -p > clang-format.patch
          cat clang-format.patch
      - name: Upload format patch
        uses: actions/upload-artifact@v7
        if: always() && steps.check-format.outcome != 'success'
        with:
          path: clang-format.patch

  build-and-test:
    name: Build and test (${{ matrix.name }})
    needs: [plan]
    if: ${{ needs.plan.outputs.has_build_matrix == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.build_matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true
    steps:
      - name: Maximize build space
        if: ${{ startsWith(matrix.os, 'ubuntu') && matrix.maximize_disk }}
        run: |
          echo "Disk space before cleanup:"
          df -h .
          available_gb=$(df -BG --output=avail . | tail -n 1 | tr -dc '0-9')
          if (( available_gb < 25 )); then
            sudo rm -rf /usr/local/lib/android
            available_gb=$(df -BG --output=avail . | tail -n 1 | tr -dc '0-9')
            if (( available_gb < 25 )); then
              sudo rm -rf /usr/share/dotnet /opt/ghc
            fi
          fi
          echo "Disk space after cleanup:"
          df -h .

      - name: Setup macOS
        if: ${{ startsWith(matrix.os, 'macos') }}
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 \
            brew install --quiet --formula gcc autoconf automake libtool openssl coreutils ninja ccache
          echo "NPROC=$(sysctl -n hw.ncpu)" >> $GITHUB_ENV
          echo "CMAKE_EXTRA_DEFS=-DOPENSSL_ROOT_DIR=/usr/local/opt/openssl" >> $GITHUB_ENV

      - name: Setup cmake
        if: ${{ startsWith(matrix.os, 'macos') }}
        # CMake 4.0 has compatibility issues with bundled third-party dependencies; pin to 3.31.
        # See https://github.com/actions/runner-images/issues/11926.
        run: |
          pipx install --force 'cmake>=3.31,<4'

      - name: Setup Linux
        if: ${{ startsWith(matrix.os, 'ubuntu') || matrix.arm_linux }}
        run: |
          sudo apt update
          sudo apt install -y ninja-build ccache lld
          echo "NPROC=$(nproc)" >> $GITHUB_ENV

      - name: Setup Linux ARM64
        if: ${{ matrix.arm_linux }}
        run: |
          sudo apt install -y git build-essential cmake libtool python3 python3-pip libssl-dev

      - name: Cache redis
        id: cache-redis
        uses: actions/cache@v6
        with:
          path: |
            ~/local/bin/redis-cli
          key: ${{ matrix.os }}-redis-cli
      - name: Cache redis server
        id: cache-redis-server
        uses: actions/cache@v6
        with:
          path: |
            ~/local/bin/redis-server
          key: ${{ matrix.os }}-redis-server
      - name: Install redis
        if: ${{ steps.cache-redis.outputs.cache-hit != 'true' || steps.cache-redis-server.outputs.cache-hit != 'true' }}
        run: |
          curl -O https://download.redis.io/releases/redis-6.2.14.tar.gz
          tar -xzvf redis-6.2.14.tar.gz
          mkdir -p $HOME/local/bin
          pushd redis-6.2.14 && BUILD_TLS=yes make -j$NPROC redis-cli && mv src/redis-cli $HOME/local/bin/ && popd
          pushd redis-6.2.14 && BUILD_TLS=yes make -j$NPROC redis-server && mv src/redis-server $HOME/local/bin/ && popd

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Restore Kvrocks dependency cache
        id: cache-kvrocks-deps
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.KVROCKS_DEPS_CACHE_DIR }}
          key: kvrocks-full-deps-${{ hashFiles('x.py', 'CMakeLists.txt', 'cmake/**/*.cmake') }}
          enableCrossOsArchive: true
      - name: Fetch Kvrocks dependencies
        if: ${{ steps.cache-kvrocks-deps.outputs.cache-hit != 'true' }}
        run: |
          ./x.py fetch-deps ${{ env.KVROCKS_DEPS_CACHE_DIR }} ${{ matrix.without_luajit }}

      - name: Set ccache directory
        if: ${{ matrix.use_ccache }}
        run: echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
      - name: Restore ccache
        if: ${{ matrix.use_ccache }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-p1-${{ matrix.cache_key }}--${{ github.sha }}
          restore-keys: ccache-p1-${{ matrix.cache_key }}--
      - name: Configure ccache
        if: ${{ matrix.use_ccache }}
        run: |
          ccache --set-config=max_size=1G
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content
          ccache --set-config=base_dir="$GITHUB_WORKSPACE"
          ccache --set-config=hash_dir=false
          ccache -z
          echo "CCACHE_CMAKE_DEFS=-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DPORTABLE=1" >> $GITHUB_ENV

      - uses: actions/setup-python@v7
        if: ${{ !matrix.arm_linux }}
        with:
          python-version: 3.x
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'tests/gocase/go.mod'
          cache: true
          cache-dependency-path: 'tests/gocase/go.sum'

      - name: Build Kvrocks
        run: |
          ./x.py build -j$NPROC --unittest --compiler ${{ matrix.compiler }} ${{ matrix.without_jemalloc }} \
            ${{ matrix.without_luajit }} ${{ matrix.with_ninja }} ${{ matrix.with_lld }} ${{ matrix.with_sanitizer }} \
            ${{ matrix.with_openssl }} ${{ matrix.new_encoding }} ${{ env.CMAKE_EXTRA_DEFS }} ${{ env.CCACHE_CMAKE_DEFS }} \
            --dep-dir ${{ env.KVROCKS_DEPS_CACHE_DIR }}
          if [[ "${{ matrix.use_ccache }}" == "true" ]]; then
            ccache -s
          fi

      - name: Setup Coredump
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: |
          echo "$(pwd)/coredumps/corefile-%e-%p-%t" | sudo tee /proc/sys/kernel/core_pattern
          mkdir coredumps

      - name: Run Unit Test
        if: ${{ matrix.run_cpp_test != false }}
        run: |
          ulimit -c unlimited
          export LSAN_OPTIONS="suppressions=$(realpath ./tests/lsan-suppressions)"
          export TSAN_OPTIONS="suppressions=$(realpath ./tests/tsan-suppressions)"
          ./x.py test cpp

      - name: Run Go Integration Cases
        run: |
          ulimit -c unlimited
          export LSAN_OPTIONS="suppressions=$(realpath ./tests/lsan-suppressions)"
          export TSAN_OPTIONS="suppressions=$(realpath ./tests/tsan-suppressions)"
          export PATH=$PATH:$HOME/local/bin/
          GOCASE_RUN_ARGS=""
          if [[ -n "${{ matrix.with_openssl }}" ]] && [[ "${{ matrix.os }}" == ubuntu* ]]; then
            git clone https://github.com/jsha/minica
            cd minica && git checkout v1.1.0 && go build && cd ..
            ./minica/minica --ca-alg rsa --domains localhost
            cp localhost/cert.pem tests/gocase/tls/cert/server.crt
            cp localhost/key.pem tests/gocase/tls/cert/server.key
            cp minica.pem tests/gocase/tls/cert/ca.crt
            GOCASE_RUN_ARGS="-tlsEnable"
          fi
          if [[ -n "${{ matrix.without_luajit }}" ]]; then
            GOCASE_RUN_ARGS="$GOCASE_RUN_ARGS -luaJITEnable=false"
          fi
          packages=()
          if [[ "${{ matrix.shard_total }}" -gt 1 ]]; then
            shard_packages=$(GOFLAGS="${GOFLAGS:-} ${{ matrix.go_tags }}" python3 .github/scripts/go_test_shard.py \
              --shard-index ${{ matrix.shard_index }} --shard-total ${{ matrix.shard_total }} --gocase-dir tests/gocase)
            if [[ -z "$shard_packages" ]]; then
              echo "No Go packages assigned to this shard."
              exit 0
            fi
            while IFS= read -r package; do
              packages+=("$package")
            done <<< "$shard_packages"
          fi
          ./x.py test go build "${packages[@]}" -count=1 -p ${{ matrix.go_pkg_parallel || 2 }} -parallel ${{ matrix.go_parallel || 2 }} \
            $GOCASE_RUN_ARGS ${{ matrix.go_tags }}

      - name: Install redis-py
        if: ${{ matrix.run_cpp_test != false && !matrix.skip_kvrocks2redis }}
        run: pip3 install redis==5.2.0

      - name: Run kvrocks2redis Test
        # Currently, when enabling TSan/ASan or running on macOS, value mismatches can occur in destination Redis.
        # See https://github.com/apache/kvrocks/issues/2195.
        if: ${{ matrix.run_cpp_test != false && !matrix.skip_kvrocks2redis }}
        run: |
          ulimit -c unlimited
          export LSAN_OPTIONS="suppressions=$(realpath ./tests/lsan-suppressions)"
          export TSAN_OPTIONS="suppressions=$(realpath ./tests/tsan-suppressions)"
          bash .github/scripts/test_kvrocks2redis.sh

      - name: Find reports and crashes
        if: always()
        run: |
          SANITIZER_OUTPUT=$(grep -rI "Sanitizer:" tests/gocase/workspace || true)
          if [[ $SANITIZER_OUTPUT ]]; then
            echo "found sanitizer reports:"
            echo "$SANITIZER_OUTPUT"
            echo "detail log:"
            cat $(echo "$SANITIZER_OUTPUT" | awk -F ':' '{print $1}')
            exit 1
          fi
          CRASHES=$(grep -rI "Ooops!" tests/gocase/workspace || true)
          if [[ $CRASHES ]]; then
            echo "found crashes:"
            echo "$CRASHES"
            echo "detail log:"
            cat $(echo "$CRASHES" | awk -F ':' '{print $1}')
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: ${{ failure() && startsWith(matrix.os, 'ubuntu') }}
        with:
          name: kvrocks-coredumps-${{ matrix.cache_key }}-${{ matrix.shard_index }}
          path: |
            ./build/kvrocks
            ./coredumps/*

  check-docker:
    name: Check Docker image
    needs: [plan]
    if: ${{ needs.plan.outputs.run_docker == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
      - name: Get core numbers
        run: echo "NPROC=$(nproc)" >> $GITHUB_ENV
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: MORE_BUILD_ARGS=-j${{ env.NPROC }}
          push: false
          tags: kvrocks:ci
          outputs: type=docker
      - name: Test built image
        run: |
          docker run --rm kvrocks:ci -v
          ID="$(docker run -d -p 6666:6666 kvrocks:ci)"
          trap 'docker rm -f "$ID" >/dev/null 2>&1 || true' EXIT
          for _ in {1..60}; do
            case "$(docker inspect --format='{{.State.Status}}' "$ID")" in
              exited|dead)
                echo "The container stopped before becoming healthy."
                docker logs "$ID" || true
                exit 1
                ;;
            esac
            if [ "$(docker inspect --format='{{.State.Health.Status}}' "$ID")" = "healthy" ]; then
              break
            fi
            sleep 1
          done
          if [ "$(docker inspect --format='{{.State.Health.Status}}' "$ID")" != "healthy" ]; then
            echo "The container is not healthy."
            docker logs "$ID" || true
            exit 1
          fi
          if [ "$(ss --listening --no-header --tcp '( sport = :6666 )')" == "" ]; then
            echo "The container listening port can not be accessed from outside."
            exit 1
          fi

  build-and-test-in-container:
    name: Build and test in container (${{ matrix.name }})
    needs: [plan]
    if: ${{ needs.plan.outputs.has_container_matrix == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.container_matrix) }}
    runs-on: ubuntu-22.04
    container:
      image: ${{ matrix.image }}
      options: ${{ matrix.container_options }}
      volumes:
        - /usr/local/lib/android:/usr-local-lib-android
        - /usr/share/dotnet:/usr-share-dotnet
    steps:
      - name: Maximize build space
        run: |
          df -h
          rm -rf /usr-local-lib-android/* /usr-share-dotnet/*
          df -h
      - name: Setup ArchLinux
        if: ${{ startsWith(matrix.image, 'archlinux') }}
        run: |
          pacman -Syu --noconfirm
          pacman -Sy --noconfirm autoconf automake python3 python-redis git wget which cmake make gcc
          echo "NPROC=$(nproc)" >> $GITHUB_ENV

          # FIXME: Workaround for gcc 15 issue for rocksdb https://github.com/apache/kvrocks/issues/2927
          echo "CXXFLAGS=$CXXFLAGS -include cstdint" >> $GITHUB_ENV

      - name: Setup openSUSE
        if: ${{ startsWith(matrix.image, 'opensuse') }}
        run: |
          zypper install -y gcc11 gcc11-c++ make wget git autoconf automake python3 python3-pip curl tar gzip cmake go which
          update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-11 100
          update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++-11 100
          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 100
          update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 100
          echo "NPROC=$(nproc)" >> $GITHUB_ENV

      - name: Setup Rocky Linux 8
        if: ${{ startsWith(matrix.image, 'rockylinux:8') }}
        run: |
          dnf install -y epel-release
          dnf config-manager --set-enabled powertools
          dnf install -y git gcc-toolset-12 autoconf automake libtool python3 python3-pip openssl-devel which cmake
          source /opt/rh/gcc-toolset-12/enable
          update-alternatives --install /usr/bin/gcc gcc /opt/rh/gcc-toolset-12/root/usr/bin/gcc 100
          update-alternatives --install /usr/bin/g++ g++ /opt/rh/gcc-toolset-12/root/usr/bin/g++ 100
          update-alternatives --install /usr/bin/cc cc /opt/rh/gcc-toolset-12/root/usr/bin/gcc 100
          update-alternatives --install /usr/bin/c++ c++ /opt/rh/gcc-toolset-12/root/usr/bin/g++ 100
          echo "NPROC=$(nproc)" >> $GITHUB_ENV

      - name: Setup Rocky Linux 9
        if: ${{ startsWith(matrix.image, 'rockylinux:9') }}
        run: |
          dnf install -y epel-release
          dnf config-manager --set-enabled crb
          dnf install -y git gcc-toolset-12 autoconf automake libtool python3 python3-pip openssl-devel which cmake
          source /opt/rh/gcc-toolset-12/enable
          update-alternatives --install /usr/bin/gcc gcc /opt/rh/gcc-toolset-12/root/usr/bin/gcc 100
          update-alternatives --install /usr/bin/g++ g++ /opt/rh/gcc-toolset-12/root/usr/bin/g++ 100
          update-alternatives --install /usr/bin/cc cc /opt/rh/gcc-toolset-12/root/usr/bin/gcc 100
          update-alternatives --install /usr/bin/c++ c++ /opt/rh/gcc-toolset-12/root/usr/bin/g++ 100
          echo "NPROC=$(nproc)" >> $GITHUB_ENV

      - name: Setup Debian 12
        if: ${{ startsWith(matrix.image, 'debian') }}
        run: |
          apt update
          apt install -y bash build-essential cmake curl git libssl-dev libtool python3 python3-pip wget
          echo "NPROC=$(nproc)" >> $GITHUB_ENV

      - name: Setup Alpine
        if: ${{ startsWith(matrix.image, 'alpine') }}
        run: |
          apk update
          apk add bash cmake curl git python3 wget make gcc g++ autoconf linux-headers py3-pip py3-redis tar zstd
          echo "NPROC=$(nproc)" >> $GITHUB_ENV

      - name: Cache redis
        id: cache-redis
        uses: actions/cache@v6
        with:
          path: |
            ~/local/bin/redis-cli
          key: ${{ matrix.image }}-redis-cli

      - name: Cache redis server
        id: cache-redis-server
        uses: actions/cache@v6
        with:
          path: |
            ~/local/bin/redis-server
          key: ${{ matrix.image }}-redis-server

      - name: Install redis
        if: ${{ steps.cache-redis.outputs.cache-hit != 'true' || steps.cache-redis-server.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          curl -O https://download.redis.io/releases/redis-6.2.14.tar.gz
          tar -xzvf redis-6.2.14.tar.gz
          mkdir -p $HOME/local/bin
          pushd redis-6.2.14 && USE_JEMALLOC=no make -j$NPROC redis-cli && mv src/redis-cli $HOME/local/bin/ && popd
          pushd redis-6.2.14 && USE_JEMALLOC=no make -j$NPROC redis-server && mv src/redis-server $HOME/local/bin/ && popd

      - uses: actions/checkout@v7
      - name: Restore Kvrocks dependency cache
        id: cache-kvrocks-deps
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.KVROCKS_DEPS_CACHE_DIR }}
          key: kvrocks-full-deps-${{ hashFiles('x.py', 'CMakeLists.txt', 'cmake/**/*.cmake') }}
          enableCrossOsArchive: true
      - name: Fetch Kvrocks dependencies
        if: ${{ steps.cache-kvrocks-deps.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          ./x.py fetch-deps ${{ env.KVROCKS_DEPS_CACHE_DIR }}

      - uses: actions/setup-go@v7
        if: ${{ !startsWith(matrix.image, 'opensuse') }}
        with:
          go-version-file: 'tests/gocase/go.mod'
          cache: false

      - name: Build Kvrocks
        shell: bash
        run: |
          ./x.py build -j$NPROC --unittest --compiler ${{ matrix.compiler }} ${{ matrix.disable_jemalloc }} \
            --dep-dir ${{ env.KVROCKS_DEPS_CACHE_DIR }}

      - name: Run Unit Test
        run: |
          ./x.py test cpp

      - name: Run Go Integration Cases
        run: |
          export PATH=$PATH:$HOME/local/bin/
          ./x.py test go build -p 2 -parallel 2

      - name: Install redis-py for openSUSE and Rocky
        if: ${{ !startsWith(matrix.image, 'archlinux') && !startsWith(matrix.image, 'debian') && !startsWith(matrix.image, 'alpine') }}
        run: pip3 install redis==4.3.6

      - name: Install redis-py for Debian
        if: ${{ startsWith(matrix.image, 'debian') }}
        run: apt install -y python3-redis

      - name: Run kvrocks2redis Test
        # FIXME: https://github.com/apache/kvrocks/issues/2574
        if: ${{ !startsWith(matrix.image, 'archlinux') }}
        shell: bash
        run: |
          bash .github/scripts/test_kvrocks2redis.sh

  required:
    if: always()
    name: Required
    runs-on: ubuntu-24.04
    needs:
      - plan
      - check-typos
      - check-and-lint
      - build-and-test
      - build-and-test-in-container
      - check-docker
    steps:
      - name: Merge requirement checking
        run: |
          set -euo pipefail
          if [[ "${{ needs.plan.result }}" != "success" || "${{ needs.check-typos.result }}" != "success" ]]; then
            echo "Plan or typo/license check failed."
            exit 1
          fi
          if [[ "${{ needs.plan.outputs.docs_only }}" == "true" ]]; then
            echo "Docs-only change verified."
            exit 0
          fi
          if [[ "${{ needs.plan.outputs.run_lint }}" == "true" && "${{ needs.check-and-lint.result }}" != "success" ]]; then
            echo "Lint and check code failed (result=${{ needs.check-and-lint.result }})."
            exit 1
          fi
          if [[ "${{ needs.plan.outputs.has_build_matrix }}" == "true" && "${{ needs.build-and-test.result }}" != "success" ]]; then
            echo "Build and test failed (result=${{ needs.build-and-test.result }})."
            exit 1
          fi
          if [[ "${{ needs.plan.outputs.has_container_matrix }}" == "true" && "${{ needs.build-and-test-in-container.result }}" != "success" ]]; then
            echo "Build and test in container failed (result=${{ needs.build-and-test-in-container.result }})."
            exit 1
          fi
          if [[ "${{ needs.plan.outputs.run_docker }}" == "true" && "${{ needs.check-docker.result }}" != "success" ]]; then
            echo "Check Docker image failed (result=${{ needs.check-docker.result }})."
            exit 1
          fi
          echo "All planned CI checks for tier '${{ needs.plan.outputs.tier }}' succeeded."
